<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable | MediaCritic</title>
<!-- Page 404 servie par GitHub Pages pour toute URL inconnue (ancien lien,
     faute de frappe). Jamais indexée ; elle renvoie vers l'annuaire et les
     critiques au lieu de la page générique de GitHub, sans aucun lien retour. -->
<meta name="robots" content="noindex, follow" />
<link rel="icon" href="/assets/logo.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#060b14;color:#eef2f7;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.p404{flex:1;max-width:720px;margin:0 auto;padding:72px 24px 80px;text-align:center}
.p404 .code{font:800 64px/1 "Syne","Inter",sans-serif;color:var(--mc-accent,#e8622d);margin-bottom:16px}
.p404 h1{margin-bottom:12px}
.p404 p{color:var(--mc-text-2,rgba(238,242,247,.72));margin-bottom:28px;line-height:1.6}
.p404-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
</style>
</head>
<body>
<nav></nav>
<main class="p404">
  <p class="code" aria-hidden="true">404</p>
  <h1>Cette page n'existe pas, ou plus</h1>
  <p>Le lien est peut-être ancien ou mal recopié. Tous les podcasts et chaînes YouTube de l'annuaire, et toutes nos critiques, sont à un clic.</p>
  <div class="p404-actions">
    <a class="mc-btn mc-btn-primary" href="/catalogue.html">Chercher dans l'annuaire</a>
    <a class="mc-btn mc-btn-secondary" href="/palmares.html">Les critiques MediaCritic</a>
    <a class="mc-btn mc-btn-secondary" href="/">Accueil</a>
  </div>
</main>
<footer></footer>
<script defer src="/assets/partage.js"></script>
</body>
</html>
