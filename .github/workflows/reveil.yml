name: Reveil du podcast du jour

# Remplace le planificateur de GitHub (30/10/2026). Sur ce depot gratuit, les
# taches programmees (cron) sont retardees de plusieurs heures ou sautees :
# le 29/10, 2 passages du podcast du jour sur ~50 programmes, et aucun le
# matin. Ce « reveil » ne depend pas du planificateur :
#   1. il calcule le prochain creneau du matin et ATTEND jusque-la (un job
#      GitHub peut durer jusqu'a 6 h) ;
#   2. a l'heure dite, il lance du-jour.yml par l'API de lancement manuel
#      (workflow_dispatch), qui part tout de suite ;
#   3. il se relance LUI-MEME de la meme facon, pour l'etape suivante.
# GitHub autorise un workflow a declencher workflow_dispatch avec son propre
# GITHUB_TOKEN (exception documentee) : aucun acces externe.
# Demarrage : au push de ce fichier sur main ; amorcage de secours par cron
# si la boucle s'est arretee. Une seule boucle a la fois (concurrency).

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reveil.yml']
  workflow_dispatch:
  schedule:
    - cron: '41 */4 * * *'   # secours : relance la boucle si elle est morte

permissions:
  actions: write
  contents: read

concurrency:
  group: reveil
  cancel-in-progress: true

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Attendre le prochain creneau, lancer le podcast du jour, se relancer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Creneaux en heure UTC : 4h30, 5h30, 6h30, 7h30, 9h00
          # (5h30 a 10h a Paris l'hiver, une heure de plus l'ete). Les
          # passages suivants s'arretent seuls si le choix du jour est fait.
          python3 - > attente.txt <<'PY'
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          creneaux = [(4, 30), (5, 30), (6, 30), (7, 30), (9, 0)]
          cibles = []
          for d in (0, 1):
              j = (now + dt.timedelta(days=d)).date()
              for h, m in creneaux:
                  t = dt.datetime(j.year, j.month, j.day, h, m, tzinfo=dt.timezone.utc)
                  if t > now + dt.timedelta(seconds=30):
                      cibles.append(t)
          attente = int((min(cibles) - now).total_seconds())
          MAXI = 5 * 3600 + 30 * 60          # sous la limite de 6 h d'un job
          print(min(attente, MAXI), 1 if attente <= MAXI else 0, min(cibles).isoformat())
          PY
          read ATTENTE TIRE CIBLE < attente.txt
          echo "Prochain creneau : $CIBLE (attente ${ATTENTE} s, lancement a l'issue : $TIRE)"
          sleep "$ATTENTE"
          if [ "$TIRE" = "1" ]; then
            gh workflow run du-jour.yml --repo "$REPO" --ref main
            echo "Podcast du jour lance."
          fi
          gh workflow run reveil.yml --repo "$REPO" --ref main
          echo "Reveil relance pour l'etape suivante."
