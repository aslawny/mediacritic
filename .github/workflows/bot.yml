name: Bot enrichissement catalogue

# Rafraîchit les données du catalogue (notes Apple, stats YouTube, découverte).
# Secrets requis (Settings → Secrets and variables → Actions) :
#   YOUTUBE_API_KEY        — clé API YouTube Data v3 (restreinte à cette API)
#   SPOTIFY_CLIENT_ID      — optionnel
#   SPOTIFY_CLIENT_SECRET  — optionnel
# Les secrets ne sont jamais écrits dans le code ni dans les logs (masquage
# automatique GitHub). Le push utilise le GITHUB_TOKEN éphémère du job.
on:
  schedule:
    - cron: "45 2 * * *"   # tous les jours à 02:45 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-enrichissement
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte des données
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python scripts/collect_data.py --mode all
      - name: Régénération fiches + catalogue + palmarès
        run: |
          python scripts/generate_fiches.py
          python scripts/generate_palmares.py
      - name: Validation avant push
        run: python scripts/ci_validate.py
      - name: Commit & push
        run: |
          git config user.name "MediaCritic Bot"
          git config user.email "bot@mediacritic.fr"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "auto: enrichissement catalogue — $(date -u +%F)"
            git pull --rebase -X ours origin gh-pages || true
            git push origin gh-pages
          fi
