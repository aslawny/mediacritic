name: Validation du site

# CI de validation — aucun secret requis, lecture seule.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Valider JSON-LD, sitemap, compteurs, cohérence
        run: python scripts/ci_validate.py
