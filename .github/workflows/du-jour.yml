name: Podcast du jour

# Chaque matin : choisit l'emission de l'annuaire qui parle de l'actualite du
# moment (lien direct par un episode reel), met a jour le bloc de l'accueil,
# l'archive podcast-du-jour.html, la fiche de l'emission et le kit reseaux
# (kit-du-jour.html, visuels assets/du-jour/). Voir scripts/du_jour.py.

on:
  schedule:
    # Appels TRES frequents (29/10/2026). GitHub retarde ou saute les taches
    # programmees des depots gratuits : le 28 et le 29/10, aucun des trois
    # creneaux du matin n'a ete lance. Un seul passage suffit, les autres
    # s'arretent des la premiere etape (« deja choisi »). Depot public :
    # minutes d'Actions gratuites et illimitees.
    # Toutes les 15 min de 3 h a 8 h 45 UTC (4 h - 9 h 45 a Paris l'hiver),
    # puis toutes les heures jusqu'a 21 h UTC en filet de securite.
    - cron: '*/15 3-8 * * *'
    - cron: '7 9-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Verrou PROPRE a cette tache : partage avec enrich.yml, un passage toutes
# les 15 min pouvait annuler un enrichissement en attente (GitHub annule le
# run en attente d'un groupe quand un nouveau arrive). Un croisement avec
# l'enrichissement est gere par la reprise du push (rebase).
concurrency:
  group: du-jour
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  du-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1

      # Arret immediat si le choix du jour est deja en ligne.
      - name: Deja publie aujourd'hui ?
        id: deja
        working-directory: site
        run: |
          if python3 -c "import json,datetime,sys; h=json.load(open('data/du_jour.json',encoding='utf-8'))['historique']; sys.exit(0 if h and h[0]['date']==datetime.datetime.now(datetime.timezone.utc).date().isoformat() else 1)"; then
            echo "deja=true" >> "$GITHUB_OUTPUT"
            echo "Podcast du jour deja publie aujourd'hui : rien a faire."
          else
            echo "deja=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.11
        if: steps.deja.outputs.deja != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.deja.outputs.deja != 'true'
        run: |
          pip install --quiet requests pillow certifi
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true

      - name: Choix du podcast du jour
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        run: python scripts/du_jour.py

      # La fiche de l'emission choisie porte la mention « Podcast du jour » :
      # du_jour.py l'a marquee, generate_fiches.py ne regenere qu'elle.
      - name: Fiche de l'emission
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        run: python scripts/generate_fiches.py

      - name: Accueil, archive, kit, visuels
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        run: python scripts/generate_du_jour.py

      - name: Validate site
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        run: python scripts/ci_validate.py

      # Publication sur X, seule et sans controle (choix de l'utilisateur).
      # Secrets crees par l'utilisateur ; absents => etape sautee. Un refus
      # de X ne bloque pas la mise a jour du site (continue-on-error).
      - name: Publication sur X
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/poster_x.py

      - name: Commit and push
        if: steps.deja.outputs.deja != 'true'
        working-directory: site
        run: |
          git config user.name  "MediaCritic Bot"
          git config user.email "bot@mediacritic.fr"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à publier"
            exit 0
          fi
          git commit -m "auto: podcast du jour — $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push origin gh-pages; then exit 0; fi
            git fetch --depth=20 origin gh-pages
            git rebase origin/gh-pages || { git rebase --abort; exit 1; }
          done
          exit 1
