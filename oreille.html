<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#060b14" />
<title>L'Oreille — devine le podcast au son (prototype) | MediaCritic</title>
<meta name="description" content="Prototype : une seconde de son, puis un peu plus à chaque erreur. Reconnais-tu le podcast ?" />
<!-- Prototype non publie : ni indexe, ni dans le sitemap, ni dans le menu. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/logo.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/mc.css" />
<style>
body{margin:0;background:var(--mc-bg);color:var(--mc-text);font-family:var(--mc-font);-webkit-text-size-adjust:100%}
.or{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
.or [hidden]{display:none !important}
.or-haut{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.or-retour{color:var(--mc-text-2);text-decoration:none;font-size:var(--mc-fs-small);min-height:44px;display:inline-flex;align-items:center}
.or-proto{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mc-accent);border:1px solid rgba(232,98,45,.5);border-radius:999px;padding:3px 9px}
.or-tete{text-align:center;margin:4px 0 20px}
.or-tete h1{font-family:var(--mc-font-brand);font-size:34px;margin:0;letter-spacing:-.01em}
.or-tete p{margin:6px 0 0;color:var(--mc-text-2);font-size:15px}

/* Le lecteur : gros bouton rond + anneau de progression de l'extrait */
.or-scene{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px}
.or-jouer{position:relative;width:132px;height:132px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#ff8a57,var(--mc-accent) 55%,#b8441a);color:var(--mc-on-accent);cursor:pointer;box-shadow:0 10px 40px rgba(232,98,45,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s}
.or-jouer:active{transform:scale(.96)}
.or-jouer:focus-visible{outline:3px solid var(--mc-text);outline-offset:4px}
.or-jouer svg.or-anneau{position:absolute;inset:-10px;width:152px;height:152px;transform:rotate(-90deg);pointer-events:none}
.or-anneau circle{fill:none;stroke-width:5}
.or-anneau .fond{stroke:var(--mc-line-2)}
.or-anneau .prog{stroke:var(--mc-text);stroke-linecap:round;transition:stroke-dashoffset .06s linear}
.or-ico{width:46px;height:46px;display:block;margin:0 auto}
.or-jouer.charge .or-ico{animation:or-pulse 1s ease-in-out infinite}
@keyframes or-pulse{50%{opacity:.35}}
.or-libelle{font-weight:700;font-size:17px;min-height:1.3em}

/* Les paliers : une echelle de volume qui monte a chaque erreur */
.or-paliers{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:64px;margin:0 0 4px;padding:0;list-style:none}
.or-paliers li{width:34px;border-radius:6px 6px 3px 3px;background:var(--mc-surface-2);border:1px solid var(--mc-line);position:relative;transition:background .25s,height .25s}
.or-paliers li span{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:11px;color:var(--mc-text-3);font-variant-numeric:tabular-nums}
.or-paliers li.ouvert{background:var(--mc-accent);border-color:var(--mc-accent)}
.or-paliers li.rate{background:rgba(232,98,45,.25);border-color:rgba(232,98,45,.45)}
.or-paliers li.gagne{background:#3fbf7f;border-color:#3fbf7f}
.or-paliers li.ouvert span,.or-paliers li.gagne span{color:var(--mc-text);font-weight:700}

.or-indice{margin:28px 0 0;background:var(--mc-surface);border:1px solid var(--mc-line);border-radius:var(--mc-r-md);padding:10px 14px;font-size:15px}
.or-indice b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mc-accent);margin-bottom:2px}

/* Saisie (meme combobox que le Mystere) */
.or-form{margin-top:36px;scroll-margin-top:12px}
.or-indice+.or-form{margin-top:16px}
.or-ligne{display:flex;gap:8px}
.or-saisie{flex:1;min-width:0;min-height:52px;padding:0 14px;font:inherit;font-size:16px;color:var(--mc-text);background:var(--mc-surface-2);border:1px solid var(--mc-line-2);border-radius:var(--mc-r-md)}
.or-saisie:focus{outline:2px solid var(--mc-accent);outline-offset:1px}
.or-btn{min-height:52px;padding:0 18px;font:inherit;font-weight:700;border-radius:var(--mc-r-md);border:1px solid var(--mc-line-2);background:var(--mc-surface-2);color:var(--mc-text);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.or-btn-plein{background:var(--mc-accent);border-color:var(--mc-accent);color:var(--mc-on-accent)}
.or-pret .or-btn-plein{box-shadow:0 0 0 3px rgba(232,98,45,.35)}
.or-passer{width:100%;margin-top:10px;background:none;border-style:dashed;color:var(--mc-text-2);font-weight:600}
.or-sugg{list-style:none;margin:6px 0 0;padding:4px;background:var(--mc-surface);border:1px solid var(--mc-line-2);border-radius:var(--mc-r-md);max-height:280px;overflow-y:auto;overscroll-behavior:contain}
.or-sugg li[role=option]{min-height:48px;display:flex;align-items:center;padding:0 12px;border-radius:var(--mc-r-sm);cursor:pointer;font-size:16px;-webkit-tap-highlight-color:transparent}
.or-sugg li[role=option]+li{border-top:1px solid var(--mc-line)}
.or-sugg li[aria-selected=true],.or-sugg li[role=option]:hover{background:var(--mc-surface-2)}
.or-sugg-vide{padding:12px;color:var(--mc-text-3);font-size:14px}
.or-retour{min-height:1.4em;margin:8px 0 0;font-weight:600;color:#ffb38f}
.or-essais{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.or-essais li{font-size:14px;padding:4px 10px;border-radius:999px;background:rgba(232,98,45,.12);border:1px solid rgba(232,98,45,.35);text-decoration:line-through;text-decoration-color:rgba(238,242,247,.5)}
.or-essais li.passe{text-decoration:none;color:var(--mc-text-3);background:none;border-style:dashed}

/* Revelation */
.or-revel{margin-top:8px;background:var(--mc-surface);border:1px solid var(--mc-line-2);border-radius:var(--mc-r-lg);padding:20px 16px;text-align:center;animation:or-entree .4s ease-out}
@keyframes or-entree{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.or-revel h2{margin:0 0 14px;font-size:22px}
.or-revel h2:focus{outline:none}
.or-revel img{width:160px;height:160px;border-radius:var(--mc-r-md);object-fit:cover;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.or-nom{font-size:21px;font-weight:800;margin:12px 0 2px}
.or-ep{color:var(--mc-text-2);font-size:14px;margin:0 0 16px}
.or-actions{display:flex;flex-direction:column;gap:8px}
.or-copie{min-height:1.3em;color:#7ee2a8;font-size:14px;margin:6px 0 0}
.or-note{margin-top:28px;color:var(--mc-text-3);font-size:13px;line-height:1.6;text-align:center}
@media (prefers-reduced-motion:reduce){.or-revel,.or-jouer.charge .or-ico{animation:none}}
</style>
</head>
<body>
<main class="or" id="or">
  <div class="or-haut">
    <a class="or-retour" href="/">← MediaCritic</a>
    <span class="or-proto">Prototype</span>
  </div>
  <header class="or-tete">
    <h1>L'Oreille</h1>
    <p id="or-sous">Reconnais le podcast au son. Une seconde, puis un peu plus à chaque erreur.</p>
  </header>

  <section class="or-scene" aria-label="Lecteur de l'extrait">
    <button class="or-jouer" id="or-jouer" type="button" aria-label="Écouter l'extrait">
      <svg class="or-anneau" viewBox="0 0 152 152" aria-hidden="true"><circle class="fond" cx="76" cy="76" r="72"/><circle class="prog" id="or-prog" cx="76" cy="76" r="72"/></svg>
      <svg class="or-ico" id="or-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <div class="or-libelle" id="or-libelle" aria-live="polite">Écouter 1 seconde</div>
    <ol class="or-paliers" id="or-paliers" aria-label="Durée de l'extrait selon les essais"></ol>
  </section>

  <p class="or-indice" id="or-indice" hidden></p>

  <form class="or-form" id="or-form" autocomplete="off" novalidate>
    <div class="or-ligne">
      <input id="or-saisie" class="or-saisie" type="text" enterkeyhint="send" aria-label="Ta proposition"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="or-sugg"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="C'est quel podcast ?" />
      <button type="submit" class="or-btn or-btn-plein">Valider</button>
    </div>
    <ul class="or-sugg" id="or-sugg" role="listbox" aria-label="Suggestions" hidden></ul>
    <p class="or-retour" id="or-retour" role="status" aria-live="assertive"></p>
    <button type="button" class="or-btn or-passer" id="or-passer">Je ne sais pas, plus de son ▸</button>
    <ul class="or-essais" id="or-essais" aria-label="Tes propositions"></ul>
  </form>

  <section class="or-revel" id="or-revel" hidden aria-labelledby="or-revel-titre"></section>

  <p class="or-note">Prototype de jeu MediaCritic. Les extraits sont lus directement depuis le flux officiel de chaque émission, rien n'est hébergé ici.</p>
</main>

<script>
(function () {
  'use strict';
  var PALIERS = [1, 3, 6, 10, 16, 25];   // secondes d'ecoute, essai par essai
  var MAX = PALIERS.length;
  var CLE = 'mc-oreille-proto-v1';
  var ORIGINE = Date.UTC(2026, 10, 25);   // partie n°1 = 25/11/2026
  var $ = function (id) { return document.getElementById(id); };
  var donnees, partie, numero, etat, noms = [], nomsCherche = [];
  var audio = new Audio(); audio.preload = 'none';
  var fin = 0, rafId = 0, lecture = false;
  var R = 72, CIRC = 2 * Math.PI * R;

  function normaliser(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/&/g, ' et ').replace(/[^a-z0-9]+/g, '');
  }
  // Tolerance : « grosses tetes » = « Les Grosses Têtes » ; « Change ma vie »
  // suffit pour « Change ma vie : Outils pour l'esprit ».
  function sansArticle(s) {
    return String(s || '').trim().replace(/^(les|le|la|l['’]|un|une|the)\s*/i, '');
  }
  function variantes(nom) {
    var v = [nom, nom.split(/\s+[-–—:|(]\s*|\s*[:(]\s*/)[0]];
    return v.concat(v.map(sansArticle)).map(normaliser).filter(function (x) { return x.length >= 3; });
  }
  function bonneReponse(v) {
    var x = [normaliser(v), normaliser(sansArticle(v))];
    return variantes(partie.nom).some(function (b) { return x.indexOf(b) >= 0; });
  }
  function pourRecherche(s) {
    return ' ' + String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(/&/g, ' et ').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  }
  function el(tag, attrs, enfants) {
    var n = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === 'texte') n.textContent = attrs[k];
      else if (k === 'classe') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (enfants || []).forEach(function (e) { if (e) n.appendChild(e); });
    return n;
  }
  function charger() { try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) { return {}; } }
  function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }
  function jeu() {
    etat.parties = etat.parties || {};
    return etat.parties[numero] || (etat.parties[numero] = { essais: [], fini: false, gagne: false });
  }

  /* ---------- son ---------- */
  function dureeCourante() { var p = jeu(); return p.fini ? 0 : PALIERS[Math.min(p.essais.length, MAX - 1)]; }
  function anneau(f) { $('or-prog').style.strokeDashoffset = String(CIRC * (1 - Math.max(0, Math.min(1, f)))); }
  function icone(pause) {
    $('or-ico').innerHTML = pause
      ? '<rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/>'
      : '<path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>';
  }
  function arreter() {
    audio.pause(); lecture = false; cancelAnimationFrame(rafId);
    $('or-jouer').classList.remove('charge'); icone(false);
  }
  function boucle() {
    var p = jeu(), duree = p.fini ? 0 : dureeCourante();
    if (!p.fini) {
      var t = audio.currentTime - partie.debut;
      anneau(t / duree);
      if (audio.currentTime >= fin) { arreter(); anneau(1); setTimeout(function () { if (!lecture) anneau(0); }, 500); return; }
    }
    rafId = requestAnimationFrame(boucle);
  }
  function jouer() {
    var p = jeu();
    if (lecture) { arreter(); anneau(0); return; }
    fin = p.fini ? Infinity : partie.debut + dureeCourante();
    var depart = p.fini ? Math.max(partie.debut, audio.currentTime || partie.debut) : partie.debut;
    // play() doit partir du geste (iOS) : au 1er toucher on pose la source
    // avec un fragment #t= pour que le navigateur demarre deja au bon endroit.
    if (!audio.src) audio.src = partie.audio + '#t=' + partie.debut;
    else if (Math.abs(audio.currentTime - depart) > 0.3) audio.currentTime = depart;
    $('or-jouer').classList.add('charge'); icone(true); lecture = true;
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function () { arreter(); $('or-libelle').textContent = 'Lecture impossible, réessaie.'; });
    try { if (window.gtag) gtag('event', 'oreille_ecoute', { palier: dureeCourante() }); } catch (e) {}
  }
  audio.addEventListener('playing', function () {
    $('or-jouer').classList.remove('charge');
    if (!jeu().fini && audio.currentTime < partie.debut - 0.5) audio.currentTime = partie.debut;
    cancelAnimationFrame(rafId); rafId = requestAnimationFrame(boucle);
  });
  audio.addEventListener('waiting', function () { if (lecture) $('or-jouer').classList.add('charge'); });
  audio.addEventListener('error', function () { arreter(); $('or-libelle').textContent = 'Le son ne se charge pas. Vérifie ta connexion.'; });

  /* ---------- rendu ---------- */
  function rendre() {
    var p = jeu();
    var ol = $('or-paliers'); ol.textContent = '';
    PALIERS.forEach(function (s, i) {
      var cls = '';
      if (p.gagne && i === p.essais.length - 1) cls = 'gagne';
      else if (i < p.essais.length) cls = 'rate';
      else if (!p.fini && i === p.essais.length) cls = 'ouvert';
      ol.appendChild(el('li', { classe: cls, style: 'height:' + (16 + i * 9) + 'px', 'aria-label': s + ' s' }, [el('span', { texte: s + ' s' })]));
    });
    var s = dureeCourante();
    $('or-libelle').textContent = p.fini ? 'Écouter la suite de l\'épisode' : 'Écouter ' + s + (s > 1 ? ' secondes' : ' seconde');
    $('or-jouer').setAttribute('aria-label', $('or-libelle').textContent);
    // Coups de pouce tardifs : la categorie au 4e essai, le titre de l'episode au 6e.
    var ind = $('or-indice'), n = p.essais.length;
    if (!p.fini && n >= 5) { ind.hidden = false; ind.innerHTML = ''; ind.appendChild(el('b', { texte: 'Dernier coup de pouce · titre de l\'épisode' })); ind.appendChild(document.createTextNode(masquer(partie.episode))); }
    else if (!p.fini && n >= 3) { ind.hidden = false; ind.innerHTML = ''; ind.appendChild(el('b', { texte: 'Coup de pouce · catégorie' })); ind.appendChild(document.createTextNode(partie.categorie.replace(/-/g, ' '))); }
    else ind.hidden = true;
    var ul = $('or-essais'); ul.textContent = '';
    p.essais.forEach(function (e, i) {
      if (p.gagne && i === p.essais.length - 1) return;
      ul.appendChild(el('li', { classe: e === '' ? 'passe' : '', texte: e === '' ? 'passé' : e }));
    });
    $('or-form').hidden = p.fini;
    if (p.fini) revelation(); else $('or-revel').hidden = true;
    $('or-sous').textContent = 'Partie n°' + (numero + 1) + ' · reconnais le podcast au son.';
  }
  // Le titre d'episode trahit souvent l'emission : on masque son nom.
  function masquer(t) {
    var mots = partie.nom.split(/\s+/).filter(function (m) { return m.length > 3; });
    mots.forEach(function (m) { t = t.replace(new RegExp(m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '•••'); });
    return t;
  }
  function score() {
    var p = jeu();
    return PALIERS.map(function (s, i) {
      if (i >= p.essais.length) return '⬛';
      if (p.gagne && i === p.essais.length - 1) return '🟩';
      return p.essais[i] === '' ? '⬜' : '🟥';
    }).join('');
  }
  function texteDePartage() {
    var p = jeu();
    return '👂 L\'Oreille n°' + (numero + 1) + ' · ' + (p.gagne ? 'trouvé en ' + PALIERS[p.essais.length - 1] + ' s' : 'pas trouvé') +
      '\n' + score() + '\nhttps://www.mediacritic.fr/oreille.html';
  }
  function revelation() {
    var p = jeu(), sec = $('or-revel');
    if (!sec.hidden && sec.dataset.n === String(numero)) return;
    sec.dataset.n = String(numero); sec.textContent = '';
    sec.appendChild(el('h2', { id: 'or-revel-titre', tabindex: '-1', texte: p.gagne ? 'Bien entendu ! Trouvé en ' + PALIERS[p.essais.length - 1] + ' s 👂' : 'Raté, c\'était…' }));
    sec.appendChild(el('img', { src: partie.image, alt: '', width: '160', height: '160', referrerpolicy: 'no-referrer' }));
    sec.appendChild(el('p', { classe: 'or-nom', texte: partie.nom }));
    sec.appendChild(el('p', { classe: 'or-ep', texte: '« ' + partie.episode + ' »' }));
    var retour = el('p', { classe: 'or-copie', role: 'status' });
    var bPart = el('button', { type: 'button', classe: 'or-btn or-btn-plein', texte: 'Partager mon score' });
    bPart.addEventListener('click', function () {
      var t = texteDePartage();
      if (navigator.share) navigator.share({ text: t }).catch(function () {});
      else if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { retour.textContent = 'Copié !'; });
    });
    var bFiche = el('a', { classe: 'or-btn', href: '/fiches/' + partie.slug + '.html', texte: 'Voir la fiche de l\'émission' });
    var bSuite = el('button', { type: 'button', classe: 'or-btn', texte: 'Partie suivante (prototype) ▸' });
    bSuite.addEventListener('click', function () { etat.decalage = (etat.decalage || 0) + 1; sauver(); demarrer(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    sec.appendChild(el('div', { classe: 'or-actions' }, [bPart, bFiche, bSuite]));
    sec.appendChild(retour);
    sec.hidden = false;
  }

  /* ---------- jeu ---------- */
  function terminer(gagne) {
    var p = jeu(); p.fini = true; p.gagne = gagne; sauver();
    arreter(); rendre();
    var h = $('or-revel-titre'); if (h) { h.focus({ preventScroll: true }); $('or-revel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    try { if (window.gtag) gtag('event', 'oreille_fin', { resultat: gagne ? 'gagne' : 'perdu', essais: p.essais.length }); } catch (e) {}
  }
  function apresErreur(msg) {
    var p = jeu();
    if (p.essais.length >= MAX) { $('or-retour').textContent = ''; terminer(false); return; }
    $('or-retour').textContent = msg + ' Tu as droit à ' + PALIERS[p.essais.length] + ' s de son.';
    sauver(); arreter(); anneau(0); rendre();
    // Sur telephone : on ferme le clavier et on remonte au bouton d'ecoute.
    if (matchMedia('(pointer: coarse)').matches) { $('or-saisie').blur(); $('or-jouer').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
  function proposer(v) {
    var p = jeu(); v = String(v || '').trim();
    if (p.fini) return;
    if (!normaliser(v)) { $('or-retour').textContent = 'Écris le nom d\'un podcast.'; return; }
    if (p.essais.some(function (e) { return normaliser(e) === normaliser(v); })) { $('or-retour').textContent = 'Déjà proposé !'; return; }
    p.essais.push(v); $('or-saisie').value = '';
    if (bonneReponse(v)) { $('or-retour').textContent = ''; terminer(true); return; }
    apresErreur('Non, ce n\'est pas « ' + v + ' ».');
  }

  /* ---------- suggestions ---------- */
  var sugg = [], actif = -1;
  function chercher(q) {
    var x = pourRecherche(q).trim(); if (!x) return [];
    var deja = jeu().essais.map(normaliser), a = [], b = [], c = [];
    noms.forEach(function (nom, i) {
